}</script><script>
const bank=JSON.parse(document.getElementById('question-data').textContent);
const all=bank.questions,$=s=>document.querySelector(s),label={single:'单选题',multiple:'多选题',judge:'判断题'};
const storageKey='javaQuizProgress',sequenceKey=storageKey+'Sequence';
let current=[],answers={},submitted=false,wrongIds=[],peeked={},mode='random',sequenceOffset=0,sequenceAttempts={};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function filters(){return {search:$('#search').value,lecture:$('#lecture').value,type:$('#type').value,difficulty:$('#difficulty').value,size:$('#size').value}}
function applyFilters(f={}){for(const id of ['search','lecture','type','difficulty','size'])if(f[id]!==undefined)$(`#${id}`).value=f[id]}
function filtered(){const k=$('#search').value.trim().toLowerCase(),l=$('#lecture').value,t=$('#type').value,d=$('#difficulty').value;return all.filter(q=>(!k||[q.stem,...q.topics].join(' ').toLowerCase().includes(k))&&(!l||String(q.lecture)===l)&&(!t||q.type===t)&&(!d||q.difficulty===d))}
function signature(){const f=filters();return [f.search.trim().toLowerCase(),f.lecture,f.type,f.difficulty,f.size].join('|')}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function batchSize(pool){return Number($('#size').value)||pool.length||1}
function clearAttempt(){answers={};submitted=false;wrongIds=[];peeked={}}
function attemptKey(){return `${signature()}@${sequenceOffset}`}
function storeAttempt(){if(mode==='sequence'&&current.length)sequenceAttempts[attemptKey()]={answers,submitted,wrongIds,peeked}}
function loadAttempt(){const a=sequenceAttempts[attemptKey()];if(a){answers=a.answers||{};submitted=!!a.submitted;wrongIds=a.wrongIds||[];peeked=a.peeked||{}}else clearAttempt()}
function saveSequence(){if(mode!=='sequence')return;storeAttempt();localStorage.setItem(sequenceKey,JSON.stringify({signature:signature(),offset:sequenceOffset,attempts:sequenceAttempts,filters:filters()}))}
function save(){saveSequence();localStorage.setItem(storageKey,JSON.stringify({ids:current.map(q=>q.id),answers,submitted,wrongIds,peeked,mode,sequenceOffset,sequenceAttempts,filters:filters()}))}
function startRandom(){storeAttempt();const pool=filtered(),n=batchSize(pool);mode='random';current=shuffle(pool).slice(0,n);clearAttempt();save();render()}
function startSequence(fromStart=false){storeAttempt();const pool=filtered(),sig=signature();let saved=null;try{saved=JSON.parse(localStorage.getItem(sequenceKey))}catch{}mode='sequence';if(fromStart||saved?.signature!==sig){sequenceOffset=0;sequenceAttempts={}}else{sequenceOffset=Math.min(saved?.offset||0,Math.max(0,pool.length-1));sequenceAttempts=saved?.attempts||{}}const n=batchSize(pool);sequenceOffset=Math.floor(sequenceOffset/n)*n;current=pool.slice(sequenceOffset,sequenceOffset+n);loadAttempt();save();render()}
function moveSequence(direction){if(mode!=='sequence')return;storeAttempt();const pool=filtered(),n=batchSize(pool),last=Math.max(0,Math.floor((Math.max(0,pool.length-1))/n)*n);sequenceOffset=Math.max(0,Math.min(last,sequenceOffset+direction*n));current=pool.slice(sequenceOffset,sequenceOffset+n);loadAttempt();save();render();window.scrollTo({top:document.querySelector('.summary').offsetTop-80,behavior:'smooth'})}
function answerText(q){return Array.isArray(q.answer)?q.answer.join('、'):q.answer}
function render(){const host=$('#questions'),pool=filtered(),from=current.length?sequenceOffset+1:0,to=sequenceOffset+current.length;$('#count').textContent=mode==='sequence'?`顺序刷题：第 ${from}–${to} 题 / 筛选后 ${pool.length} 题`:`随机练习 ${current.length} 题 / 筛选后 ${pool.length} 题`;$('#score').textContent=submitted?scoreText():'';for(const id of ['prevBatch','nextBatch','seqRestart'])$(`#${id}`).hidden=mode!=='sequence';if(!current.length){host.innerHTML='<div class="empty">没有符合条件的题目，请调整筛选后重新生成练习。</div>';return}host.innerHTML=current.map(q=>{const opts=q.type==='judge'?['正确','错误']:q.options,inputType=q.type==='multiple'?'checkbox':'radio',selected=answers[q.id]||[],isPeeked=!!peeked[q.id];return `<article class="card" id="${q.id}"><div class="meta"><span class="tag">${q.id}</span><span class="tag">第${q.lecture}讲</span><span class="tag">${label[q.type]}</span><span class="tag">${q.difficulty}</span><span class="tag">${esc(q.topics.join(' / '))}</span></div><h3>${esc(q.stem)}</h3>${q.code?`<pre class="code">${esc(q.code)}</pre>`:''}<fieldset style="border:0;padding:0;margin:0"><legend class="sr-only" style="position:absolute;left:-9999px">${q.id} 选项</legend>${opts.map((o,i)=>{const v=q.type==='judge'?o:'ABCD'[i];return `<label class="option"><input type="${inputType}" name="${q.id}" value="${v}" ${selected.includes(v)?'checked':''} ${submitted?'disabled':''}><span><b>${q.type==='judge'?'':'ABCD'[i]+'. '}</b>${esc(o)}</span></label>`}).join('')}</fieldset><div class="peekbar"><button type="button" class="peek" data-peek="${q.id}">${isPeeked?'收起答案':'偷瞄答案'}</button>${isPeeked?'<span class="peeked">已偷瞄，不影响提交与得分</span>':''}</div><div class="peek-answer ${isPeeked&&!submitted?'show':''}">正确答案：${answerText(q)}</div><div class="result ${submitted?'show':''}"><div class="answer">答案：${answerText(q)}</div><div>${esc(q.explanation)}</div>${Object.entries(q.optionExplanations).map(([k,v])=>`<div class="option-note"><b>${k}：</b>${esc(v)}</div>`).join('')}<div class="meta" style="margin-top:10px">依据：${q.slideRefs.map(r=>`${esc(r.deck)} 第${r.slide}页`).join('；')}</div></div></article>`}).join('');host.querySelectorAll('input').forEach(input=>input.addEventListener('change',e=>{const q=current.find(x=>x.id===e.target.name);if(q.type==='multiple')answers[q.id]=[...host.querySelectorAll(`input[name="${q.id}"]:checked`)].map(x=>x.value);else answers[q.id]=[e.target.value];save()}));host.querySelectorAll('[data-peek]').forEach(button=>button.addEventListener('click',()=>{const id=button.dataset.peek;peeked[id]=!peeked[id];save();render();document.getElementById(id)?.scrollIntoView({block:'nearest'})}));if(submitted)current.forEach(q=>document.getElementById(q.id).classList.add(isCorrect(q)?'correct':'wrong'))}
function isCorrect(q){const got=[...(answers[q.id]||[])].sort(),expected=(Array.isArray(q.answer)?q.answer:[q.answer]).slice().sort();return JSON.stringify(got)===JSON.stringify(expected)}
function scoreText(){const right=current.length-wrongIds.length;return `得分：${right} / ${current.length}（${current.length?Math.round(right/current.length*100):0}%）`}
function submit(){if(!current.length)return;submitted=true;wrongIds=current.filter(q=>!isCorrect(q)).map(q=>q.id);save();render();window.scrollTo({top:document.querySelector('.actions').offsetTop-80,behavior:'smooth'})}
function locateWrong(){if(!submitted){alert('请先提交练习。');return}const id=wrongIds[0];if(id)document.getElementById(id).scrollIntoView({behavior:'smooth',block:'center'});else alert('本次练习全部正确！')}
function reset(){clearAttempt();save();render()}
function restore(){try{const s=JSON.parse(localStorage.getItem(storageKey));if(!s?.ids?.length)return false;applyFilters(s.filters);current=s.ids.map(id=>all.find(q=>q.id===id)).filter(Boolean);answers=s.answers||{};submitted=!!s.submitted;wrongIds=s.wrongIds||[];peeked=s.peeked||{};mode=s.mode||'random';sequenceOffset=s.sequenceOffset||0;sequenceAttempts=s.sequenceAttempts||{};return true}catch{return false}}
['search','lecture','type','difficulty','size'].forEach(id=>$(`#${id}`).addEventListener('input',()=>{$('#count').textContent=`筛选后 ${filtered().length} 题`}));$('#start').onclick=startRandom;$('#sequence').onclick=()=>startSequence(false);$('#prevBatch').onclick=()=>moveSequence(-1);$('#nextBatch').onclick=()=>moveSequence(1);$('#seqRestart').onclick=()=>startSequence(true);$('#submit').onclick=submit;$('#wrong').onclick=locateWrong;$('#reset').onclick=reset;function decoratePeek(){current.forEach(q=>{const box=document.querySelector('#'+q.id+' .peek-answer.show');if(!box||box.dataset.details)return;box.dataset.details='1';box.innerHTML='<div>正确答案：'+answerText(q)+'</div><div class="peek-explanation">'+esc(q.explanation)+'</div>'+Object.entries(q.optionExplanations).map(([k,v])=>'<div class="option-note"><b>'+k+'：</b>'+esc(v)+'</div>').join('')})}const baseRender=render;render=()=>{baseRender();decoratePeek()};if(!restore())startSequence(true);else render();
</script></body></html>
